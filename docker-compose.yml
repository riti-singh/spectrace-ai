services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-spectrace-local-password}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-spectrace-local-password} 'RETURN 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      SPECTRACE_REPOSITORY_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-spectrace-local-password}"
      NEO4J_DATABASE: neo4j
    depends_on:
      neo4j:
        condition: service_healthy
    command: ["sh", "-c", "python -m scripts.seed_graph && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped

volumes:
  neo4j_data:
