name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/spectrace-ci-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p spectrace-ci-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Neo4j service health
        run: >-
          docker exec ${{ job.services.neo4j.id }}
          cypher-shell -u neo4j -p spectrace-ci-password "RETURN 1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff formatting
        run: ruff format --check .
      - name: Unit tests and coverage
        run: pytest -m "not integration" --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Neo4j integration tests
        env:
          SPECTRACE_RUN_NEO4J_TESTS: "1"
          SPECTRACE_NEO4J_TEST_ISOLATED: "1"
          SPECTRACE_NEO4J_TEST_URI: bolt://localhost:7687
          SPECTRACE_NEO4J_TEST_USERNAME: neo4j
          SPECTRACE_NEO4J_TEST_PASSWORD: spectrace-ci-password
          SPECTRACE_NEO4J_TEST_DATABASE: neo4j
          SPECTRACE_REPOSITORY_BACKEND: neo4j
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: spectrace-ci-password
          NEO4J_DATABASE: neo4j
        run: pytest -m integration
